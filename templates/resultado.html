<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva Excusa Médica</title>

<style>

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:25px;
}

.contenedor{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

.volver{
    text-decoration:none;
    color:#0b5ed7;
    font-size:18px;
    font-weight:bold;
    display:inline-block;
    margin-bottom:20px;
}

.volver:hover{
    color:#084298;
}

h2{
    text-align:center;
    color:#0b5ed7;
    margin-bottom:30px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:18px;
    box-sizing:border-box;
}

input[readonly]{
    background:#e9ecef;
    cursor:not-allowed;
    font-weight:bold;
}

button{
    width:100%;
    background:#198754;
    color:white;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:12px;
}

button:hover{
    background:#157347;
}

</style>

</head>

<body>

<div class="contenedor">

<a href="javascript:history.back()" class="volver">← Regresar</a>

<h2>Nueva Excusa Médica</h2>

<form action="/guardar_excusa" method="POST">
<input type="hidden" name="imagen_id" value="{{ imagen_id }}">
<label>👤 Nombre completo</label>
<input type="text" name="nombre" value="{{ datos.nombre }}">

<label>🪪 Cédula</label>
<input type="text" name="cedula" value="{{ datos.cedula }}">

<label>🏢 CAI / Dependencia</label>

<select name="cai" required
        style="width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:8px;margin-bottom:18px;box-sizing:border-box;">

    <option value="">Seleccione CAI / Dependencia</option>

    <option value="CAI ANDES">CAI ANDES</option>
    <option value="CAI AURES">CAI AURES</option>
    <option value="CAI COLINA CAMPESTRE">CAI COLINA CAMPESTRE</option>
    <option value="CAI EL PINAR">CAI EL PINAR</option>
    <option value="CAI EL RINCON">CAI EL RINCON</option>
    <option value="CAI FONTANAR">CAI FONTANAR</option>
    <option value="CAI GUAYMARAL">CAI GUAYMARAL</option>
    <option value="CAI LA ALHAMBRA">CAI LA ALHAMBRA</option>
    <option value="CAI LA GAITANA">CAI LA GAITANA</option>
    <option value="CAI MAZUREN">CAI MAZUREN</option>
    <option value="CAI SAN JOSE DE BAVARIA">CAI SAN JOSE DE BAVARIA</option>
    <option value="CAI TIERRA LINDA">CAI TIERRA LINDA</option>
    <option value="CAI VILLA DEL PRADO">CAI VILLA DEL PRADO</option>
    <option value="ESTACION DE POLICIA SUBA">ESTACION DE POLICIA SUBA</option>

</select>

<label>📄 Número de orden</label>
<input type="text" name="orden" value="{{ datos.orden }}">

<label>📅 Fecha inicial</label>
<input
    type="date"
    id="fecha_inicio"
    name="fecha_inicio"
    value="{{ datos.fecha_inicio }}"
    onchange="calcularDias()">

<label>📅 Fecha final</label>
<input
    type="date"
    id="fecha_final"
    name="fecha_final"
    value="{{ datos.fecha_final }}"
    onchange="calcularDias()">

<label>📆 Número de días</label>
<input
    type="number"
    id="dias"
    name="dias"
    value="{{ datos.dias }}"
    readonly>

<button type="submit">
💾 Guardar Excusa
</button>

</form>

<a href="/lista_excusas" style="text-decoration:none;">
    <button type="button">
        📋 Ver Listado
    </button>
</a>

</div>

<script>

function calcularDias(){

    const inicio = document.getElementById("fecha_inicio").value;
    const final = document.getElementById("fecha_final").value;
    const campoDias = document.getElementById("dias");

    if(!inicio || !final){
        campoDias.value = "";
        return;
    }

    const fechaInicio = new Date(inicio + "T00:00:00");
    const fechaFinal = new Date(final + "T00:00:00");

    if(fechaFinal < fechaInicio){

        campoDias.value = "";

        alert("La fecha final no puede ser anterior a la fecha inicial.");

        return;
    }

    const diferencia = fechaFinal - fechaInicio;

    const dias = Math.floor(
        diferencia / (1000 * 60 * 60 * 24)
    ) + 1;

    campoDias.value = dias;
}

/* Calcula automáticamente al abrir la página
   si la IA ya extrajo ambas fechas */
window.addEventListener("load", calcularDias);

</script>

</body>
</html>
